<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f6ff"><title>Frau Schaefers Lernwelt</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#31364b;background:#f9f8ff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{padding:54px 20px 32px;text-align:center;background:radial-gradient(circle at 15% 25%,#ffe9ef 0,transparent 38%),radial-gradient(circle at 85% 15%,#e0f4ff 0,transparent 42%),#faf6ff}.rainbow{font-size:40px}h1{font-size:clamp(30px,5vw,52px);margin:8px 0 10px;letter-spacing:-1px}header p{font-size:18px;color:#697087;margin:0}.wrap{max-width:1060px;margin:auto;padding:28px 20px 80px}.intro{text-align:center;font-size:19px;margin:6px 0 25px}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.subject{border:0;text-align:left;border-radius:26px;padding:28px;min-height:205px;box-shadow:0 10px 25px #2d34400d;transition:transform .18s,box-shadow .18s}.subject:hover,.subject:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px #2d344020}.subject .emoji{font-size:45px;display:block;margin-bottom:12px}.subject strong{font-size:27px;display:block;margin-bottom:7px}.subject small{font-size:15px;line-height:1.5}.de{background:#ffe9ed;color:#803d52}.ma{background:#e5efff;color:#335f9d}.re{background:#f0e7ff;color:#674a9a}.su{background:#e5f6e9;color:#397b55}.panel{display:none;margin-top:30px;padding:28px;background:white;border-radius:26px;box-shadow:0 10px 25px #2d344010}.panel.active{display:block}.panel h2{font-size:29px;margin:12px 0}.panel p{color:#687086}.back{border:0;background:#f1f1f7;border-radius:12px;padding:10px 15px;color:#42465c}.question{font-size:23px;font-weight:700;margin:25px 0 16px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{border:2px solid #e5e8f0;border-radius:15px;padding:18px;background:#fff;color:#33394c;font-weight:700}.answer:hover{background:#f8f7ff}.answer:disabled{cursor:default}.answer.correct{border-color:#48a56e;background:#e5f6e9}.answer.wrong{border-color:#d36d7b;background:#ffe9ed}.feedback{min-height:30px;font-size:18px;font-weight:700;margin:20px 0}.next{background:#5f63ad;color:white;border:0;border-radius:13px;padding:13px 22px;font-weight:700}.next:disabled{opacity:.4;cursor:default}.progress{font-size:14px;color:#777d90}footer{text-align:center;color:#85889b;padding:0 20px 32px;font-size:13px}@media(max-width:600px){.subjects{grid-template-columns:1fr}.subject{min-height:170px;padding:23px}.panel{padding:20px}.answers{grid-template-columns:1fr}header{padding-top:35px}}
</style></head><body><header><div class="rainbow" aria-hidden="true">🌈</div><h1>Frau Schaefers Lernwelt</h1><p>Interaktive Lernspiele für die Grundschule</p></header><main class="wrap"><p class="intro">✨ Wähle dein Lieblingsfach und lerne spielerisch! ✨</p><section class="subjects" aria-label="Schulfächer"><button class="subject de" data-subject="de"><span class="emoji">📖</span><strong>Deutsch</strong><small>Buchstaben, Lesen und Wörter entdecken →</small></button><button class="subject ma" data-subject="ma"><span class="emoji">🔢</span><strong>Mathe</strong><small>Zählen, Rechnen und Knobeln →</small></button><button class="subject re" data-subject="re"><span class="emoji">💜</span><strong>Religion</strong><small>Feste, Geschichten und Miteinander →</small></button><button class="subject su" data-subject="su"><span class="emoji">🌿</span><strong>Sachunterricht</strong><small>Tiere, Natur und unsere Welt →</small></button></section><section class="panel" id="panel" aria-live="polite"><button class="back" id="back">← Zurück zu den Fächern</button><h2 id="gameTitle"></h2><p id="gameIntro"></p><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status"></div><button class="next" id="next" disabled>Weiter →</button></section></main><footer>Mit Freude lernen · Frau Schaefers Lernwelt 🌸</footer><script>
const games={de:{title:'📖 Deutsch: Buchstaben-Detektive',intro:'Finde die richtige Antwort!',items:[['Welches Wort beginnt mit M?',['Maus','Sonne','Tisch','Ball'],0],['Welches Wort reimt sich auf Haus?',['Baum','Maus','Brot','Hand'],1],['Wie viele Silben hat „Banane“?',['1','2','3','4'],2],['Welcher Buchstabe fehlt? H _ nd',['a','o','u','e'],0]]},ma:{title:'🔢 Mathe: Rechenprofis',intro:'Rechne und finde die Lösung!',items:[['Was ist 4 + 3?',['6','7','8','9'],1],['Was ist 10 − 6?',['3','4','5','6'],1],['Welche Zahl kommt nach 19?',['18','21','20','29'],2],['Was ist 5 + 5?',['9','11','10','8'],2]]},re:{title:'💜 Religion: Miteinander',intro:'Was weißt du über Feste und gutes Zusammenleben?',items:[['Was hilft, wenn jemand traurig ist?',['Auslachen','Zuhören','Weglaufen','Schubsen'],1],['Welches Fest feiern Christinnen und Christen zur Geburt Jesu?',['Ostern','Pfingsten','Weihnachten','Erntedank'],2],['Was bedeutet es, zu teilen?',['Alles behalten','Etwas abgeben','Etwas verstecken','Wegnehmen'],1],['Was kann man nach einem Streit sagen?',['Ist mir egal','Selber schuld','Entschuldigung','Hau ab'],2]]},su:{title:'🌿 Sachunterricht: Naturforscher',intro:'Entdecke Tiere, Pflanzen und Jahreszeiten!',items:[['Was brauchen Pflanzen zum Wachsen?',['Nur Steine','Licht und Wasser','Nur Sand','Nur Wind'],1],['Welches Tier ist ein Insekt?',['Spinne','Hund','Biene','Regenwurm'],2],['In welcher Jahreszeit fallen viele Blätter von den Bäumen?',['Frühling','Sommer','Herbst','Winter'],2],['Wie viele Beine hat ein Käfer?',['4','6','8','10'],1]]}};
let current=null,index=0,score=0,answered=false;const $=id=>document.getElementById(id);document.querySelectorAll('[data-subject]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.subject;index=0;score=0;$('panel').classList.add('active');render();$('panel').scrollIntoView({behavior:'smooth',block:'start'})}));$('back').addEventListener('click',()=>{$('panel').classList.remove('active');current=null;window.scrollTo({top:0,behavior:'smooth'})});$('next').addEventListener('click',()=>{index++;render()});function render(){const g=games[current];$('gameTitle').textContent=g.title;$('gameIntro').textContent=g.intro;$('feedback').textContent='';$('answers').replaceChildren();answered=false;$('next').disabled=true;if(index>=g.items.length){$('progress').textContent='Geschafft!';$('question').textContent=`🎉 Du hast ${score} von ${g.items.length} Aufgaben richtig gelöst!`;$('feedback').textContent='Super gemacht! 🌟';$('next').textContent='Noch einmal spielen ↻';$('next').disabled=false;$('next').onclick=()=>{index=0;score=0;$('next').onclick=null;render()};return}$('next').onclick=null;$('next').textContent='Weiter →';$('progress').textContent=`Aufgabe ${index+1} von ${g.items.length}`;const [q,opts,correct]=g.items[index];$('question').textContent=q;opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=opt;b.addEventListener('click',()=>{if(answered)return;answered=true;document.querySelectorAll('.answer').forEach((el,j)=>{el.disabled=true;if(j===correct)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});if(i===correct){score++;$('feedback').textContent='Richtig! Toll gemacht! ⭐'}else{$('feedback').textContent='Fast! Die grüne Antwort ist richtig. 💛'}$('next').disabled=false});$('answers').appendChild(b)})}
</script></body></html>

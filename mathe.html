<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Zehner-Bande · Frau Schaefers Lernwelt</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9f3;color:#30344b;font-family:'Trebuchet MS',Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #f3bb58;outline-offset:3px}.wrap{max-width:1400px;margin:20px auto;padding:0 14px}.hero{position:relative}.hero img{display:block;width:100%;border-radius:28px;box-shadow:0 12px 32px #b8a0b02b}.hot{position:absolute;background:transparent;border:2px solid transparent;border-radius:22px}.hot:hover{border-color:#689aca;background:#ffffff25}.h10{left:12.5%;top:40.5%;width:24%;height:47%}.h20{left:38%;top:40.5%;width:24%;height:47%}.h100{left:63.5%;top:40.5%;width:24%;height:47%}.home{left:5%;top:8.7%;width:24%;height:7%}.rules{left:77%;top:8.7%;width:18%;height:7%}.sheet{left:59%;top:8.7%;width:16%;height:7%}.mobile{display:none}.panel{max-width:1100px;margin:25px auto 50px;border:2px solid #efdbe8;background:#fffefb;border-radius:28px;padding:clamp(18px,4vw,38px);box-shadow:0 14px 30px #b6a2b31a;scroll-margin-top:15px}.panel[hidden]{display:none}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.small{border:0;border-radius:16px;padding:12px 18px;background:#f6e5ef;color:#4c4053;font-weight:bold}.pill{border-radius:30px;background:#e9f4fd;padding:11px 17px;font-weight:bold;color:#467fa9}.title{text-align:center;font-size:clamp(28px,4vw,42px);margin:25px 0 8px}.sub{text-align:center;color:#69738a;font-size:19px;line-height:1.5}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.module{border:2px solid #dce9d8;border-radius:24px;background:#f2f9ee;padding:22px}.module:nth-child(2){background:#f1f0fd;border-color:#ded8f5}.module:nth-child(3){background:#fff2e9;border-color:#f7dfca;grid-column:1/-1}.module h2{text-align:center;margin:0 0 17px;font-size:23px}.modegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mode{border:2px solid #d6e1ee;background:#fff;border-radius:20px;padding:20px 12px;min-height:146px;color:#35374f}.mode:hover{transform:translateY(-2px);box-shadow:0 5px 14px #a8a0b328}.mode .ico{font-size:35px;display:block}.mode strong{display:block;font-size:20px;margin:9px 0}.mode small{color:#737c8d;font-size:15px}.module:nth-child(3) .modegrid{grid-template-columns:1fr}.module:nth-child(3) .mode{min-height:115px}.bar{height:13px;background:#e9e5f2;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#8eb8e4;width:0}.task{background:#fff9e8;border:2px solid #eee2bd;border-radius:24px;padding:clamp(16px,4vw,35px);min-height:300px}.question{text-align:center;font-size:clamp(23px,3vw,31px);font-weight:bold;margin:10px 0 22px}.visual{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:22px auto}.frame{display:grid;grid-template-columns:repeat(5,32px);gap:7px;padding:15px;background:white;border:3px solid #9baad4;border-radius:23px;box-shadow:3px 5px 0 #c4c9dc}.dot{width:32px;height:32px;border:3px solid #cbd5e3;background:white;border-radius:50%;padding:0}.dot.filled{background:#5b9edc;border-color:#5b9edc}.dot.show{background:#ee9f9d;border-color:#ee9f9d}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:16px;background:#679acb;color:white;font-weight:bold;padding:14px 22px;font-size:19px}.btn.secondary{background:#f3d8e7;color:#634f67}.btn.green{background:#70a985}.btn:disabled{opacity:.45;cursor:not-allowed}.big{font-size:55px;color:#4a9664;font-weight:bold;background:white;border:3px solid #a8c8aa;border-radius:18px;padding:8px 30px}.numberinput{width:150px;border:3px solid #b3c4dc;border-radius:18px;font-size:42px;text-align:center;padding:12px}.feedback{text-align:center;min-height:40px;font-weight:bold;font-size:19px}.progress{text-align:center;color:#71788c}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.choice{padding:19px;border:2px solid #cfdceb;border-radius:16px;background:white;font-size:25px;font-weight:bold}.choice.correct{background:#dff3e3;border-color:#67a878}.choice.wrong{background:#ffe4e4;border-color:#d7838d}.printoptions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.note{line-height:1.6;background:#fff6dc;padding:20px;border-radius:18px}.print{display:none}footer{text-align:center;color:#8c8190;padding:20px}@media(max-width:750px){.hero .hot{display:none}.mobile{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.mobile button{border:0;background:#e4f0f9;border-radius:13px;padding:12px}.modules{grid-template-columns:1fr}.module:nth-child(3){grid-column:auto}.modegrid{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,1fr)}.frame{grid-template-columns:repeat(5,24px);gap:4px;padding:9px}.dot{width:24px;height:24px}}@media print{.wrap,footer{display:none!important}.print{display:block!important;padding:15px;font:18px Arial}.printline{border-bottom:1px solid #aaa;padding:16px 0}}
</style>
<style>
#pit-guide{position:fixed;right:16px;bottom:16px;z-index:99999;display:flex;align-items:end;gap:8px;max-width:min(390px,calc(100vw - 24px));font-family:'Trebuchet MS',Arial,sans-serif;color:#334354}

</style>
</head><body><main class="wrap"><div class="hero" id="hero"><img src="zehner-bande.png" alt="Die Zehner-Bande: Zahlen bis 10, 20 oder 100 mit zwei Pinguinen"><a class="hot home" href="index.html" aria-label="Zurück zur Lernwelt"></a><button class="hot sheet" onclick="openInfo('sheet')" aria-label="Arbeitsblätter"></button><button class="hot rules" onclick="openInfo('rules')" aria-label="Banden-Regeln"></button><button class="hot h10" onclick="choose(10)" aria-label="Bis 10"></button><button class="hot h20" onclick="choose(20)" aria-label="Bis 20"></button><button class="hot h100" onclick="choose(100)" aria-label="Bis 100"></button></div><div class="mobile"><button onclick="choose(10)">Bis 10</button><button onclick="choose(20)">Bis 20</button><button onclick="choose(100)">Bis 100</button><button onclick="openInfo('sheet')">Arbeitsblätter</button><button onclick="openInfo('rules')">Regeln</button></div><section id="menu" class="panel" hidden><div class="top"><button class="small" onclick="goHome()">← Zur Zahlenauswahl</button><span class="pill" id="range"></span></div><h1 class="title">🐧 Die Zehner-Bande</h1><p class="sub">Wähle deine Übung!</p><div class="modules"><div class="module"><h2>👀 Zahlen sehen</h2><div class="modegrid"><button class="mode" onclick="start('count')"><span class="ico">👁️</span><strong>Wie viele sind es?</strong><small>Schau genau und zähle schlau!</small></button><button class="mode" onclick="start('show')"><span class="ico">🔢</span><strong>Zahlen zeigen</strong><small>Im Zehnerstreifen zeigen</small></button></div></div><div class="module"><h2>👂 Zahlen hören</h2><div class="modegrid"><button class="mode" onclick="start('hear')"><span class="ico">🔊</span><strong>Hör-Detektiv</strong><small>Welche Zahl hörst du?</small></button><button class="mode" onclick="start('dictation')"><span class="ico">🎧</span><strong>Zahlen-Diktat</strong><small>Hören und schreiben</small></button></div></div><div class="module"><h2>🎤 Zahlen sprechen</h2><div class="modegrid"><button class="mode" onclick="start('speak')"><span class="ico">🎙️</span><strong>Sprech-Probe</strong><small>Laut sprechen, selbst prüfen</small></button></div></div></div></section><section id="game" class="panel" hidden><div class="top"><button class="small" onclick="backMenu()">← Zum Übungsmenü</button><span class="pill" id="gameRange"></span></div><h1 class="title" id="gameTitle"></h1><p class="sub" id="instruction"></p><div class="bar"><div class="fill" id="fill"></div></div><p class="progress" id="progress"></p><div class="task"><p class="question" id="question"></p><div class="visual" id="visual"></div><div id="interaction"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="controls"><button class="btn green" id="check" onclick="check()">Prüfen ✓</button><button class="btn" id="next" onclick="next()" hidden>Weiter →</button></div></div></section><section id="info" class="panel" hidden><button class="small" onclick="goHome()">← Zurück</button><h1 class="title" id="infoTitle"></h1><div id="infoContent"></div></section></main><div class="print" id="printArea"></div><footer>Mit Freude lernen · Frau Schaefers Lernwelt 🐧</footer><script>
const $=id=>document.getElementById(id);let limit=10,mode='',round=0,number=0,selected=0,solved=false,score=0;const names={count:'Wie viele sind es?',show:'Zahlen zeigen',hear:'Hör-Detektiv',dictation:'Zahlen-Diktat',speak:'Sprech-Probe'};const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function view(id){for(let k of ['menu','game','info'])$(k).hidden=k!==id;if(id)$(id).scrollIntoView({behavior:'smooth',block:'start'})}function choose(n){limit=n;$('range').textContent=`⭐ Zahlen bis ${n}`;view('menu')}function goHome(){view(null);window.scrollTo({top:0,behavior:'smooth'})}function backMenu(){choose(limit)}function start(m){mode=m;round=0;score=0;$('gameTitle').textContent=names[m];$('gameRange').textContent=`Zahlen bis ${limit}`;view('game');newTask()}function speak(n){if(!('speechSynthesis'in window)){alert('Dein Browser unterstützt leider keine Sprachausgabe.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(n));u.lang='de-DE';u.rate=.78;speechSynthesis.speak(u)}function button(txt,fn,klass='btn secondary'){let b=document.createElement('button');b.className=klass;b.textContent=txt;b.onclick=fn;return b}function frames(n,interactive=false){let wrap=document.createElement('div');wrap.className='visual';let count=Math.ceil(limit/10);for(let f=0;f<count;f++){let frame=document.createElement('div');frame.className='frame';for(let i=1;i<=10;i++){let pos=f*10+i;if(pos>limit)break;let d=document.createElement(interactive?'button':'span');d.className='dot'+(interactive?(pos<=selected?' filled':''):(pos<=n?' show':''));if(interactive){d.type='button';d.setAttribute('aria-label',`${pos} Punkte markieren`);d.onclick=()=>{selected=pos;newDots()}}frame.appendChild(d)}wrap.appendChild(frame)}return wrap}function newDots(){let old=$('visual');old.replaceChildren(...frames(selected,true).childNodes)}function uniqueChoices(n){let set=new Set([n]);while(set.size<4)set.add(rnd(0,limit));return [...set].sort(()=>Math.random()-.5)}function newTask(){solved=false;selected=0;number=rnd(0,limit);if(mode==='show'&&number===0)number=1;$('fill').style.width=`${round/10*100}%`;$('progress').textContent=`Aufgabe ${round+1} von 10 · ⭐ ${score} richtig`;$('visual').replaceChildren();$('interaction').replaceChildren();$('feedback').textContent='';$('check').hidden=false;$('check').disabled=false;$('next').hidden=true;const intro={count:'Zähle die Punkte und wähle die richtige Zahl.',show:'Tippe auf den Punkt, bis zu dem die Zahl reicht.',hear:'Höre genau hin und wähle die richtige Zahl.',dictation:'Höre die Zahl und schreibe sie auf.',speak:'Sprich die Zahl laut aus und überprüfe dich selbst.'};$('instruction').textContent=intro[mode];$('question').textContent=mode==='show'?'Zeige: '+number:mode==='speak'?'Sprich diese Zahl:':mode==='count'?'Wie viele Punkte siehst du?':'Welche Zahl hörst du?';let area=$('interaction');if(mode==='count'){$('visual').appendChild(frames(number));addChoices(area)}else if(mode==='show'){$('visual').appendChild(frames(0,true));area.append(button('−1',()=>{selected=Math.max(0,selected-1);newDots()}),button('+1',()=>{selected=Math.min(limit,selected+1);newDots()}),button('Alles löschen',()=>{selected=0;newDots()}));area.className='controls'}else if(mode==='hear'){area.appendChild(button('🔊 Zahl anhören',()=>speak(number)));addChoices(area);setTimeout(()=>speak(number),350)}else if(mode==='dictation'){area.appendChild(button('🔊 Zahl anhören',()=>speak(number)));let input=document.createElement('input');input.type='number';input.min=0;input.max=limit;input.id='numInput';input.className='numberinput';input.setAttribute('aria-label','Gehörte Zahl');area.appendChild(input);area.className='controls';setTimeout(()=>speak(number),350)}else{let big=document.createElement('div');big.className='big';big.textContent=number;$('visual').appendChild(big);area.appendChild(button('🔊 Zahl anhören',()=>speak(number)),button('🎤 Ich habe sie gesprochen',()=>{selected=number;$('feedback').textContent='Prima! Vergleiche deine Aussprache mit der Hörprobe. 🌟';$('check').disabled=false}));area.className='controls'}if(mode==='hear'||mode==='count')$('check').disabled=true;if(mode==='speak')$('check').textContent='Ich habe geübt ✓';else $('check').textContent='Prüfen ✓'}function addChoices(area){area.className='choices';for(let n of uniqueChoices(number)){let b=button(String(n),()=>{if(solved)return;selected=n;check()},'choice');area.appendChild(b)}}function check(){if(solved)return;let val=mode==='dictation'?Number($('numInput').value):selected;if(mode==='dictation'&&$('numInput').value===''){$('feedback').textContent='Schreibe zuerst eine Zahl auf.';return}solved=true;let ok=mode==='speak'||val===number;if(ok)score++;$('feedback').textContent=ok?'Richtig! Super gemacht! ⭐':`Fast! Richtig ist ${number}. Du schaffst das! 💛`;$('check').hidden=true;$('next').hidden=false;$('next').textContent=round===9?'Ergebnis ansehen 🎉':'Weiter →';for(let b of document.querySelectorAll('#interaction .choice')){b.disabled=true;if(Number(b.textContent)===number)b.classList.add('correct');else if(Number(b.textContent)===selected)b.classList.add('wrong')}}function next(){round++;if(round===10){$('fill').style.width='100%';$('progress').textContent='Alle 10 Aufgaben geschafft!';$('question').textContent='🎉 Wunderbar geübt!';$('visual').replaceChildren();$('interaction').replaceChildren();$('feedback').textContent=`Du hast ${score} von 10 Aufgaben geschafft. ⭐`;$('check').hidden=true;$('next').hidden=true;$('interaction').append(button('Noch einmal spielen ↻',()=>start(mode)),button('Andere Übung wählen',backMenu));$('interaction').className='controls';return}newTask()}function openInfo(type){view('info');if(type==='rules'){$('infoTitle').textContent='📖 Banden-Regeln';$('infoContent').innerHTML='<div class="note"><p>🐧 Wähle deinen Zahlenraum: bis 10, 20 oder 100.</p><p>👀 <b>Zahlen sehen:</b> Mengen erkennen oder Punkte passend zur Zahl markieren.</p><p>👂 <b>Zahlen hören:</b> Zahl anhören und erkennen oder selbst aufschreiben.</p><p>🎤 <b>Zahlen sprechen:</b> Zahl laut sagen und mit der Hörprobe vergleichen.</p><p>⭐ Übe in jeder Runde zehn Aufgaben. Viel Spaß!</p></div>'}else{$('infoTitle').textContent='🖨️ Arbeitsblätter';$('infoContent').innerHTML='<p class="sub">Wähle den Zahlenraum für ein ausdruckbares Zahlen-Arbeitsblatt.</p><div class="printoptions"><button class="btn" onclick="printSheet(10)">Bis 10</button><button class="btn" onclick="printSheet(20)">Bis 20</button><button class="btn" onclick="printSheet(100)">Bis 100</button></div>'}}function printSheet(n){let html=`<h1>🐧 Die Zehner-Bande – Zahlen bis ${n}</h1><p>Name: ________________________ Datum: __________</p><h2>Zahlen lesen und schreiben</h2>`;for(let i=0;i<12;i++){let x=rnd(0,n);html+=`<div class="printline">${i+1}. &nbsp; Schreibe die Zahl ${x} in Worten: ___________________________</div>`}html+='<p>⭐ Prima gemacht!</p>';$('printArea').innerHTML=html;window.print()}
</script>
<script>
(function(){
const page=location.pathname.split('/').pop()||'index.html';
const guides={
'index.html':[
'Hallo! Ich bin Pit, dein Lernpinguin! 🐧 Schön, dass du da bist. Such dir ein Fach auf der großen Startseite aus.',
'Tipp: Bei Deutsch wirst du zum Wörter-Detektiv. Bei Mathe warten spannende Zahlenspiele auf dich!',
'Du kannst jederzeit ein neues Fach wählen. Ich bin dabei! 🌟'],
'deutsch.html':[
'Willkommen im Wörterland! 📖 Wähle ein Abenteuer aus. Möchtest du lieber Adjektive erforschen oder Verben entdecken?',
'Wenn du auf ein Spiel tippst, beginnt dein Abenteuer. Viel Spaß beim Forschen!'],
'adjektiv-detektive.html':[
'Pssst! 🔎 Ich bin Pit, dein Detektiv-Partner. Wir suchen heute geheime Wiewörter! Lies zuerst unsere Ermittlungsakte.',
'Prima! In der Zentrale warten sechs Fälle. Du darfst selbst aussuchen, welche Spur du zuerst verfolgst.',
'Bei jeder Spur gilt: Lies die Aufgabe genau. Du kannst in Ruhe nachdenken. Fehler sind erlaubt!',
'Wenn du einen Fall löst, bekommst du Sterne. Ich bin stolz auf dich! ⭐'],
'mathe.html':[
'Hallo, Zahlenforscher! 🔢 Ich bin Pit. Wähle zuerst deinen Zahlenraum: 10, 20 oder 100.',
'Super! Jetzt kannst du Zahlen sehen, zeigen, hören und sprechen. Such dir eine Übung aus.',
'Mein Tipp: Nutze die Punkte zum Zählen und prüfe deine Lösung. Du schaffst das! 🌟']
};
const lines=guides[page]||guides['index.html'];let pos=0;
const el=document.createElement('aside');el.id='pit-guide';el.setAttribute('aria-label','Pit, dein Lernbegleiter');
el.innerHTML='<div class="pit-bubble" aria-live="polite"><strong>🐧 Pit hilft dir</strong><span id="pit-message"></span><div class="pit-actions"><button type="button" id="pit-next">Weiter →</button><button type="button" class="pit-close" id="pit-hide">Schließen</button></div></div><button class="pit-face" type="button" aria-label="Pit öffnen">🐧</button>';
document.body.appendChild(el);
const msg=el.querySelector('#pit-message');function say(n){pos=Math.max(0,Math.min(n,lines.length-1));msg.textContent=lines[pos];el.querySelector('#pit-next').textContent=pos===lines.length-1?'Nochmal ↻':'Weiter →'}
say(0);
el.querySelector('#pit-next').addEventListener('click',()=>say(pos===lines.length-1?0:pos+1));
el.querySelector('#pit-hide').addEventListener('click',()=>el.classList.add('pit-minimized'));
el.querySelector('.pit-face').addEventListener('click',()=>el.classList.toggle('pit-minimized'));
document.addEventListener('click',e=>{
const target=e.target.closest('button,a');if(!target||el.contains(target))return;
if(page==='index.html'&&target.matches('[data-subject="de"]')){say(1);el.classList.remove('pit-minimized')}
if(page==='adjektiv-detektive.html'&&/Ermittlungen starten|Loslegen|Nächste Spur|Zur Zentrale|ermitteln/i.test(target.textContent)){say(/Ermittlungen starten|Zur Zentrale/i.test(target.textContent)?1:2);el.classList.remove('pit-minimized')}
if(page==='mathe.html'&&/10|20|100|starten|üben/i.test(target.textContent)&&pos===0){say(1);el.classList.remove('pit-minimized')}
},true);
})();
</script>

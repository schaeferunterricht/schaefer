<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die Zehner-Bande · Frau Schaefers Lernwelt</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9f2;color:#303044;font-family:'Trebuchet MS',Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.wrap{max-width:1400px;margin:20px auto;padding:0 14px}.hero{position:relative}.hero img{display:block;width:100%;border-radius:30px;box-shadow:0 10px 36px #c5a2b533}.hot{position:absolute;border:3px solid transparent;background:transparent;border-radius:25px;cursor:pointer}.hot:hover,.hot:focus-visible{border-color:#8b72b6;background:#ffffff20;outline:3px solid white}.h10{left:12.5%;top:40.5%;width:24%;height:47%}.h20{left:38%;top:40.5%;width:24%;height:47%}.h100{left:63.5%;top:40.5%;width:24%;height:47%}.home{left:5%;top:8.7%;width:24%;height:7%}.rules{left:77%;top:8.7%;width:18%;height:7%}.sheet{left:59%;top:8.7%;width:16%;height:7%}.panel{max-width:950px;margin:25px auto 55px;border:2px solid #f1d9e9;background:white;border-radius:28px;padding:clamp(18px,4vw,38px);box-shadow:0 15px 30px #ac92a31a;scroll-margin-top:20px}.panel[hidden]{display:none}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.smallbtn{border:0;background:#f8e8f2;padding:12px 18px;border-radius:15px;font-weight:bold;color:#504058}.title{font-size:clamp(26px,4vw,40px);margin:18px 0 8px}.muted{color:#6c7182}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.choice{border:2px solid #dbe6ef;background:#f0f8ff;border-radius:22px;padding:22px 10px;font-size:26px;font-weight:bold}.choice:nth-child(2){background:#f0f9ef;border-color:#d6ead8}.choice:nth-child(3){background:#fff0f2;border-color:#f4d5dd}.choice:hover,.answer:hover{filter:brightness(.97)}.progress{font-size:17px;color:#686879;margin:18px 0}.bar{height:12px;border-radius:30px;background:#f2e7f0;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#90c7ec,#d98bb6);transition:width .2s}.question{font-size:clamp(22px,3vw,30px);font-weight:bold;margin:24px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.answer{background:#fff;border:2px solid #e0e0ec;border-radius:18px;padding:19px 12px;font-size:23px;min-height:74px}.answer.correct{background:#e2f6e7;border-color:#65aa7d}.answer.wrong{background:#ffe7e7;border-color:#e58b96}.feedback{min-height:45px;font-size:19px;font-weight:bold;margin:18px 0}.next{border:0;background:#6d99c6;color:white;padding:14px 26px;border-radius:16px;font-weight:bold;font-size:19px}.next:disabled{opacity:.35;cursor:default}.dots{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.dot{width:18px;height:18px;border-radius:50%;background:#5a9bdc}.ten{display:flex;gap:6px;flex-wrap:wrap;width:154px;padding:7px;border:2px solid #bed9f1;border-radius:10px}.ten .dot{width:19px;height:19px}.count{display:inline-flex;align-items:center;justify-content:center;background:#e9f4ff;border-radius:18px;padding:10px 18px;font-size:38px;font-weight:bold;color:#3675ad}.inputnum{font:inherit;font-size:26px;padding:12px;border:2px solid #c8c7d9;border-radius:12px;max-width:160px}.note{background:#fff7dc;padding:14px 18px;border-radius:16px;line-height:1.6}.mobile-select{display:none}.print-area{display:none}footer{text-align:center;color:#8a7d89;margin:25px} @media(max-width:700px){.hero .hot{display:none}.mobile-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.mobile-select button{border:0;border-radius:14px;padding:14px 5px;background:#e5f1fb;font-weight:bold}.mobile-select button:nth-child(2){background:#e6f4e6}.mobile-select button:nth-child(3){background:#fce5ea}.answers{grid-template-columns:1fr}.choices{gap:7px}.choice{padding:14px 4px;font-size:22px}}@media print{body{background:white}.wrap,.panel,footer{display:none!important}.print-area{display:block!important;font:18px Arial;padding:20px}.print-area h1{font-size:28px}.print-row{padding:15px 0;border-bottom:1px solid #bbb}}
</style></head><body><main class="wrap"><div class="hero"><img src="zehner-bande.png" alt="Die Zehner-Bande mit zwei Pinguinen und den Zahlenräumen 10, 20 und 100"><a class="hot home" href="index.html" aria-label="Zurück zur Startseite"></a><button class="hot sheet" data-action="sheet" aria-label="Arbeitsblätter"></button><button class="hot rules" data-action="rules" aria-label="Banden-Regeln"></button><button class="hot h10" data-limit="10" aria-label="Zahlen bis 10 üben"></button><button class="hot h20" data-limit="20" aria-label="Zahlen bis 20 üben"></button><button class="hot h100" data-limit="100" aria-label="Zahlen bis 100 üben"></button></div><div class="mobile-select"><button data-limit="10">Bis 10</button><button data-limit="20">Bis 20</button><button data-limit="100">Bis 100</button></div><section class="panel" id="panel" hidden><div class="topline"><button class="smallbtn" id="back">← Zur Auswahl</button><span id="points">⭐ 0 Punkte</span></div><h1 class="title" id="title">Die Zehner-Bande</h1><p class="muted" id="intro"></p><div class="bar"><div class="fill" id="fill"></div></div><p class="progress" id="progress"></p><div id="visual"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><button class="next" id="next" disabled>Weiter →</button></section><section class="panel" id="info" hidden><button class="smallbtn" id="closeInfo">← Zur Auswahl</button><h1 class="title" id="infoTitle"></h1><div id="infoText"></div></section></main><div class="print-area" id="printArea"></div><footer>Mit Freude lernen · Frau Schaefers Lernwelt 🐧</footer><script>
const $=id=>document.getElementById(id);let limit=10,items=[],idx=0,score=0,locked=false;function rand(n){return Math.floor(Math.random()*n)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function pickChoices(answer,max){let s=new Set([answer]);while(s.size<4)s.add(rand(max+1));return shuffle([...s])}function makeItems(max){const q=[];for(let i=0;i<4;i++){let n=rand(max+1);q.push({kind:'read',n,q:'Welche Zahl ist das?',a:n})}for(let i=0;i<4;i++){let a=rand(max+1),b=rand(max-a+1);q.push({kind:'plus',a,b,q:`Wie viel ist ${a} + ${b}?`,a0:a+b})}for(let i=0;i<4;i++){let a=rand(max+1),b=rand(a+1);q.push({kind:'minus',a,b,q:`Wie viel ist ${a} − ${b}?`,a0:a-b})}return shuffle(q)}function openGame(max){limit=max;items=makeItems(max);idx=0;score=0;$('info').hidden=true;$('panel').hidden=false;$('title').textContent=`🐧 Die Zehner-Bande · bis ${max}`;$('intro').textContent='Zähle, erkenne und rechne! Du schaffst das!';render();$('panel').scrollIntoView({behavior:'smooth',block:'start'})}function dotDisplay(n){const outer=document.createElement('div');outer.style.display='flex';outer.style.flexWrap='wrap';outer.style.gap='8px';outer.style.maxWidth='620px';if(n===0){outer.innerHTML='<span class="count">0</span>';return outer}for(let start=0;start<n;start+=10){let t=document.createElement('div');t.className='ten';for(let j=0;j<Math.min(10,n-start);j++){let d=document.createElement('span');d.className='dot';t.appendChild(d)}outer.appendChild(t)}return outer}function render(){locked=false;$('answers').replaceChildren();$('visual').replaceChildren();$('feedback').textContent='';$('next').disabled=true;$('points').textContent=`⭐ ${score} Punkte`;$('fill').style.width=`${Math.min(idx,items.length)/items.length*100}%`;if(idx>=items.length){$('progress').textContent='Geschafft!';$('fill').style.width='100%';$('question').textContent=`🎉 ${score} von ${items.length} Aufgaben richtig!`;$('feedback').textContent=score===items.length?'Wunderbar! Du bist ein Zahlen-Profi! 🌟':'Toll geübt! Versuch es gerne noch einmal. 💛';$('next').textContent='Noch einmal spielen ↻';$('next').disabled=false;return}const item=items[idx];$('progress').textContent=`Aufgabe ${idx+1} von ${items.length}`;$('next').textContent='Weiter →';if(item.kind==='read'){$('visual').appendChild(dotDisplay(item.n));$('question').textContent=item.q}else{$('question').textContent=item.q}const answer=item.kind==='read'?item.a:item.a0;pickChoices(answer,limit).forEach(n=>{let b=document.createElement('button');b.className='answer';b.textContent=n;b.addEventListener('click',()=>{if(locked)return;locked=true;for(let el of $('answers').children){el.disabled=true;if(Number(el.textContent)===answer)el.classList.add('correct');else if(el===b)el.classList.add('wrong')}if(n===answer){score++;$('feedback').textContent='Richtig! Super gemacht! ⭐'}else{$('feedback').textContent=`Gut versucht! Richtig ist ${answer}. 💛`}$('points').textContent=`⭐ ${score} Punkte`;$('next').disabled=false});$('answers').appendChild(b)})}document.querySelectorAll('[data-limit]').forEach(b=>b.addEventListener('click',()=>openGame(Number(b.dataset.limit))));$('next').addEventListener('click',()=>{if(idx>=items.length){openGame(limit)}else{idx++;render()}});$('back').addEventListener('click',()=>{$('panel').hidden=true;window.scrollTo({top:0,behavior:'smooth'})});$('closeInfo').addEventListener('click',()=>{$('info').hidden=true;window.scrollTo({top:0,behavior:'smooth'})});function info(which){$('panel').hidden=true;$('info').hidden=false;if(which==='rules'){$('infoTitle').textContent='📖 Die Banden-Regeln';$('infoText').innerHTML='<p class="note">1. Wähle einen Zahlenraum: bis 10, 20 oder 100.<br>2. Zähle die Punkte oder löse die Rechnung.<br>3. Klicke auf die richtige Antwort.<br>4. Sammle Sterne und werde Zahlen-Profi! ⭐</p>'}else{$('infoTitle').textContent='🖨️ Arbeitsblätter';$('infoText').innerHTML='<p>Erstelle ein Übungsblatt zum Ausdrucken:</p><div class="choices"><button class="choice" data-print="10">Bis 10</button><button class="choice" data-print="20">Bis 20</button><button class="choice" data-print="100">Bis 100</button></div><p class="muted">Es werden zehn Rechenaufgaben mit Platz für Antworten gedruckt.</p>';document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printSheet(Number(b.dataset.print)))}$('info').scrollIntoView({behavior:'smooth',block:'start'})}document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>info(b.dataset.action)));function printSheet(max){let out=`<h1>🐧 Die Zehner-Bande – Zahlen bis ${max}</h1><p>Name: ________________________ Datum: ______________</p>`;for(let i=0;i<10;i++){let a=rand(max+1),b=rand(max+1);if(i%2===0){b=rand(max-a+1);out+=`<div class="print-row">${i+1}. &nbsp; ${a} + ${b} = __________</div>`}else{b=rand(a+1);out+=`<div class="print-row">${i+1}. &nbsp; ${a} − ${b} = __________</div>`}}$('printArea').innerHTML=out;window.print()}
</script></body></html>
